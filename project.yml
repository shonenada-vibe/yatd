name: YATD
options:
  bundleIdPrefix: com.shonenada
  deploymentTarget:
    macOS: "15.0"
packages:
  YATDCore:
    path: YATDCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  YATD:
    type: application
    platform: macOS
    sources: [YATD]
    dependencies:
      - package: YATDCore
    info:
      path: YATD/Info.plist
      properties:
        CFBundleDisplayName: YATD
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shonenada.yatd
        # Runs the `ntn` CLI as a subprocess, which the App Sandbox forbids.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
